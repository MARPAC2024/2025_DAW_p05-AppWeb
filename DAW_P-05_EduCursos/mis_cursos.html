<!DOCTYPE html>
<html lang="es" data-modalidad-theme="Todos">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCursos - Mis Cursos</title>
    <link rel="icon" type="image/x-icon" href="img/logo.ico" onerror="this.href='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%230F172A\' stroke=\'%23FACC15\' stroke-width=\'6\'/><path d=\'M30 65 L50 30 L70 65 Z\' fill=\'%2306B6D4\'/></svg>'">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Cargar fuente Krub para el Canvas -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Krub:wght@400;700&display=swap">
    
    <!-- <link rel="stylesheet" href="css/estilos.css">

    <!-- Script para cargar el archivo CSS con la fecha y hora actual en tiempo real -->
    <script>
        (function() {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'css/estilos.css?v=' + new Date().getTime();
            document.head.appendChild(link);
        })();
    </script>
</head>
<body>
    <!-- 
    <header class="header">
        <a href="index.html" class="logo-link">
            <img src="img/logo.jpg" alt="Logo EduCursos" class="header__logo-img" onerror="this.style.display='none'">
            <h1 class="logo">Edu<span>Cursos</span></h1>
        </a>
    </header>
    -->
    <header class="header">
        <a href="index.html" class="logo-link">
            <img src="img/logo.jpg" alt="Logo EduCursos" class="header__logo-img">
            
            <!-- Contenedor vertical de los títulos -->
            <div class="logo-textos">
                <span class="logo-subtitulo">CUETLACHTLI</span>
                <h1 class="logo">Edu<span>Cursos</span></h1>
            </div>
        </a>
    </header>

    <div class="nav-bg">
        <nav class="navegacion contenedor">
            <a class="navegacion__enlace" href="index.html"><i class="bi bi-grid-3x3-gap-fill"></i> Catálogo</a>
            <a class="navegacion__enlace" href="inscripciones.html"><i class="bi bi-pen-fill"></i> Inscripciones</a>
            <a class="navegacion__enlace navegacion__enlace--activo" href="mis_cursos.html"><i class="bi bi-journal-check"></i> Mis Cursos</a>
            <a class="navegacion__enlace" href="contacto.html"><i class="bi bi-envelope-fill"></i> Contacto</a>
            <button class="btn-wishlist-nav" onclick="abrirModalWishlist()">
                <i class="bi bi-heart-fill"></i> Wishlist (<span id="wishlist-counter">0</span>)
            </button>
        </nav>
    </div>

    <main class="contenedor">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 2rem;">
            <h2><i class="bi bi-journal-bookmark-fill"></i> Listado de Inscripciones</h2>
            <button class="boton" style="max-width: 250px; font-size: 1.8rem;" onclick="exportarInscripcionesTxt()"><i class="bi bi-file-earmark-arrow-down-fill"></i> Exportar a TXT</button>
        </div>

        <div class="sombra-neon">
            <div class="tabla-contenedor">
                <table class="tabla" id="tabla-inscripciones">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Alumno</th>
                            <th>Curso</th>
                            <th>Modalidad</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-inscripciones">
                        <!-- JS Carga -->
                    </tbody>
                </table>
            </div>
        </div>

        <h2><i class="bi bi-bar-chart-line-fill"></i> Inscritos por Curso</h2>
        <div class="sombra-neon" style="text-align: center;">
            <canvas id="canvas-grafico" width="600" height="300" style="max-width: 100%; height: auto; background-color: var(--oscuro); border-radius: 0.5rem;"></canvas>
        </div>
    </main>

    <!-- Modal Wishlist en Azul Marino Metálico -->
    <div class="modal-overlay" id="modal-wishlist">
        <div class="modal-wishlist">
            <div class="modal-wishlist-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--azul-wishlist); padding-bottom: 1rem; margin-bottom: 2rem;">
                <h3 style="margin: 0; color: var(--azul-wishlist);"><i class="bi bi-heart-fill"></i> Mi Wishlist</h3>
                <button class="boton" style="width: auto; padding: 0.5rem 1.5rem; background-color: transparent; color: var(--blanco); border: 1px solid var(--gris);" onclick="cerrarModalWishlist()">✕</button>
            </div>
            <div id="wishlist-lista"></div>
        </div>
    </div>

    <footer class="footer">
        <p class="footer__texto">© 2026 EduCursos - Facultad de Ciencias de la Computación BUAP</p>
    </footer>

    <script src="js/utilidades.js"></script>
    <script src="js/inscripciones.js"></script>
    <script src="js/wishlist.js"></script>
</body>
</html>
